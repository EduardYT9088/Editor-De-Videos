on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p android/app/src/main/assets android/app/src/main/res/values android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/java/com/nexora/animes
          cat > android/settings.gradle.kts <<'NEXORA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AnimesNexora"
          include(":app")
          NEXORA_EOF
          cat > android/build.gradle.kts <<'NEXORA_EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          NEXORA_EOF
          cat > android/gradle.properties <<'NEXORA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          NEXORA_EOF
          cat > android/app/build.gradle.kts <<'NEXORA_EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.nexora.animes"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.nexora.animes"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies { implementation("androidx.webkit:webkit:1.11.0") }
          NEXORA_EOF
          cat > android/app/src/main/AndroidManifest.xml <<'NEXORA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="Animes Nexora"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
