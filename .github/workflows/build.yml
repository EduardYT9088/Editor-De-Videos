                  <path android:fillColor="#FFFFFFFF" android:fillAlpha="0.8"
                      android:pathData="M27,49.5h2a3,3 0,0 1,3,3v3a3,3 0,0 1,-3,3h-2a3,3 0,0 1,-3,-3v-3a3,3 0,0 1,3,-3z" />
                  <path android:fillColor="#FFFFFFFF" android:fillAlpha="0.5"
