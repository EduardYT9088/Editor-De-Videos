                      android:pathData="M81,17 C81.9,22.4 83.6,24.1 89,25 C83.6,25.9 81.9,27.6 81,33 C80.1,27.6 78.4,25.9 73,25 C78.4,24.1 80.1,22.4 81,17 Z" />
