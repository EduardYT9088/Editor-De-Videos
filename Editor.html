<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120F24">
<title>Editor de Video Nexora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Dela+Gothic+One&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Permanent+Marker&family=Rampart+One&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F0FA; --surface:#FFFFFF; --surface2:#ECE7F7; --line:#DCD4EF;
  --text:#1B1533; --muted:#6B6390; --pink:#E2307F; --cyan:#0A9DBB;
  --stage:#0E0B1D; --danger:#D9344B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120F24; --surface:#1B1734; --surface2:#272046; --line:#352D5C;
    --text:#F3F0FF; --muted:#A79FCB; --pink:#FF4FA3; --cyan:#47E5FF;
    --stage:#07060F; --danger:#FF6177;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120F24; --surface:#1B1734; --surface2:#272046; --line:#352D5C;
  --text:#F3F0FF; --muted:#A79FCB; --pink:#FF4FA3; --cyan:#47E5FF;
  --stage:#07060F; --danger:#FF6177;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;position:relative}

/* ---------- Inicio ---------- */
.home{height:100%;overflow-y:auto;padding:18px 18px 48px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 22px}
.brand h1{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:22px;margin:0;line-height:1.05}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
.new{position:relative;overflow:hidden;width:100%;border-radius:24px;padding:22px 20px;color:#fff;text-align:left;
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(125deg,#FF4FA3 0%,#9B5CF6 52%,#2FC9EA 100%);
  box-shadow:0 14px 34px rgba(155,92,246,.32)}
.new::after{content:"";position:absolute;right:-28px;top:50%;width:150px;height:150px;margin-top:-75px;background:rgba(255,255,255,.13);clip-path:polygon(28% 18%,28% 82%,82% 50%);pointer-events:none}
.new .plus{flex:none;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.new .plus svg{width:30px;height:30px}
.new strong{display:block;font-size:20px;font-weight:800}
.new span{display:block;font-size:13px;opacity:.92;margin-top:2px;max-width:30ch}
.formats{display:flex;gap:8px;margin:14px 0 30px;overflow-x:auto;scrollbar-width:none}
.formats::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fchip i{display:block;border:2px solid currentColor;border-radius:3px}
.fchip[aria-pressed="true"]{border-color:var(--pink);color:var(--pink)}
.home h2{font-size:17px;font-weight:800;margin:0 0 12px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.proj{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.proj .open{display:block;width:100%;text-align:left}
.proj .th{aspect-ratio:4/5;background:var(--stage) center/cover no-repeat}
.proj .meta{padding:8px 10px 10px}
.proj b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj small{font-size:11.5px;color:var(--muted)}
.proj .del{position:absolute;top:6px;right:6px;height:30px;min-width:30px;padding:0 7px;border-radius:10px;background:rgba(10,8,22,.6);color:#fff;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.proj .del svg{width:16px;height:16px}
.proj .del.confirm{background:var(--danger)}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}

/* ---------- Editor ---------- */
.editor{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;height:54px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn:active{background:var(--surface2)}
.top .name{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-weight:700;font-size:14px;padding:6px;border-radius:8px;text-overflow:ellipsis}
.top .name:focus{background:var(--surface2);outline:none}
.top select{background:var(--surface2);border:0;border-radius:10px;padding:8px 8px;color:var(--text);font:inherit;font-weight:700;font-size:13px}
.export{flex:none;background:var(--pink);color:#fff;font-weight:800;border-radius:12px;padding:9px 15px;font-size:14px}
.stage{flex:1;min-height:150px;display:grid;place-items:center;background:var(--stage);position:relative;overflow:hidden}
#cv{display:block;touch-action:none;border-radius:4px}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#CFC8EE;padding:20px}
.stage-empty button{margin-top:12px;background:var(--pink);color:#fff;font-weight:800;border-radius:14px;padding:12px 18px;display:inline-flex;gap:8px;align-items:center}
.stage-empty p{margin:0;font-size:14px;line-height:1.5}
.ctrl{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;height:50px}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:104px}
.time b{color:var(--text);font-weight:700}
.ctrl .mid{display:flex;align-items:center;gap:4px}
.play{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.ctrl .right{display:flex;gap:2px;min-width:104px;justify-content:flex-end}

.tlwrap{flex:none;position:relative;height:166px;background:var(--surface);border-top:1px solid var(--line)}
.tl{height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.tl::-webkit-scrollbar{display:none}
.tlin{position:relative;height:100%}
.ruler{position:absolute;left:0;top:0;height:22px;width:100%;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler span{position:absolute;top:5px;transform:translateX(-50%)}
.ruler i{position:absolute;top:10px;width:3px;height:3px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.row{position:absolute;left:0;width:100%}
.vrow{top:28px;height:58px}
.trow{top:94px;height:28px}
.arow{top:128px;height:28px}
.clip{position:absolute;top:0;height:100%;border-radius:10px;overflow:hidden;background:#2b2446 repeat-x left center;background-size:auto 100%;border:2px solid transparent}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.clip .d{position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:6px}
.clip .fx{position:absolute;right:4px;top:3px;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:2px;display:grid}
.clip .fx svg{width:12px;height:12px}
.trans{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:7px;background:var(--surface);color:var(--text);display:grid;place-items:center;z-index:2;border:1px solid var(--line)}
.trans svg{width:12px;height:12px}
.trans.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.blk{position:absolute;top:0;height:100%;border-radius:8px;font-size:11px;font-weight:700;padding:0 8px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;border:2px solid transparent}
.blk svg{flex:none;width:13px;height:13px}
.tblk{background:var(--pink);color:#fff}
.ablk{background:var(--cyan);color:#06222B;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 6px)}
.blk.sel{border-color:var(--text)}
.addrow{position:absolute;top:0;height:100%;border-radius:8px;border:1.5px dashed var(--line);color:var(--muted);font-size:11.5px;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.addrow svg{width:13px;height:13px}
.vrow .addrow{font-size:13px;border-radius:10px;padding:0 14px}
.playhead{position:absolute;left:50%;top:20px;bottom:6px;width:2px;margin-left:-1px;background:var(--text);pointer-events:none;z-index:5;border-radius:2px}
.playhead::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--text)}
.addclip{position:absolute;right:8px;top:36px;width:42px;height:42px;border-radius:12px;background:var(--text);color:var(--bg);display:grid;place-items:center;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.zoom{position:absolute;right:8px;top:1px;display:flex;gap:2px;z-index:6}
.zoom button{width:28px;height:20px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.zoom svg{width:15px;height:15px}

.tools{flex:none;display:flex;gap:2px;overflow-x:auto;padding:6px 6px 8px;height:76px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;padding:6px 4px;border-radius:12px}
.tool:active{background:var(--surface2)}
.tool.back{min-width:46px;border-right:1px solid var(--line);border-radius:0;margin-right:4px}
.tool.danger{color:var(--danger)}

/* ---------- Panel inferior ---------- */
.scrim{position:absolute;inset:0;z-index:19;background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.35);z-index:20;max-height:56%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 4px 18px}
.sh-head h3{margin:0;font-size:16px;font-weight:800}
.tabs{flex:none;display:flex;gap:4px;overflow-x:auto;padding:2px 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);background:var(--surface2)}
.sh-body{overflow-y:auto;padding:4px 16px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.opt{border-radius:13px;background:var(--surface2);padding:9px 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;min-height:58px;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--pink)}
.opt .sw{width:100%;aspect-ratio:1;border-radius:9px;background:#3a3160 center/cover no-repeat}
.opt .big{font-size:24px;line-height:1.1}
.opt .ratio{border:2px solid currentColor;border-radius:4px}
.slider{display:flex;align-items:center;gap:12px;margin:12px 0}
.slider label{min-width:72px;font-size:13px;font-weight:700}
.slider input{flex:1;accent-color:var(--pink);min-width:0}
.slider output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 10px;line-height:1.5}
textarea.txt{width:100%;min-height:78px;border-radius:14px;background:var(--surface2);border:0;color:var(--text);font:inherit;font-size:16px;padding:12px;resize:none;-webkit-user-select:text;user-select:text}
.colors{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.col[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink)}
.colors input[type=color]{width:42px;height:42px;border:0;padding:0;background:none;border-radius:50%}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{padding:10px 14px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill svg{width:16px;height:16px}

/* ---------- Exportar ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,22,.9);display:grid;place-items:center;color:#fff;padding:20px}
.card{width:min(380px,100%);text-align:center}
.ring{width:140px;height:140px;margin:0 auto 18px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.card h3{margin:0 0 6px;font-size:19px;font-weight:800}
.card p{margin:0 0 18px;color:#CFC8EE;font-size:13.5px;line-height:1.55}
.card video{width:100%;max-height:48vh;border-radius:14px;background:#000;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px}
.btn.primary{background:var(--pink);color:#fff}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Galería integrada ---------- */
.gallery{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.g-top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;height:54px}
.g-top h3{margin:0;font-size:17px;font-weight:800}
.g-top select{max-width:62%;background:var(--surface2);border:0;border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;font-weight:700;font-size:14px}
.g-tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.g-tabs button{flex:1;padding:12px 0 13px;font-size:14.5px;font-weight:700;color:var(--muted);position:relative}
.g-tabs button[aria-selected="true"]{color:var(--text)}
.g-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:-1px;width:34px;height:3px;margin-left:-17px;border-radius:3px;background:var(--pink)}
.g-search{flex:none;padding:4px 12px 10px}
.g-search input{width:100%;border:0;border-radius:12px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px;padding:11px 14px;-webkit-user-select:text;user-select:text}
.g-note{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-size:12.5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line)}
.g-note button{color:var(--pink);font-weight:800;font-size:13px;flex:none}
.g-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.g-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
@media (min-width:700px){.g-grid{grid-template-columns:repeat(6,1fr)}}
.g-tile{position:relative;aspect-ratio:1;background:var(--surface2);overflow:hidden;display:block}
.g-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.g-dur{position:absolute;right:5px;bottom:4px;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
.g-chk{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.g-tile.on .g-chk{background:var(--pink);border-color:var(--pink)}
.g-tile.on img{opacity:.72}
.g-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.g-prev{flex:none;width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.g-prev svg{width:18px;height:18px}
.g-meta{flex:1;min-width:0}
.g-meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-use{flex:none;background:var(--pink);color:#fff;border-radius:10px;padding:8px 13px;font-weight:800;font-size:13px}
.g-msg{padding:48px 26px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.g-msg b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.g-msg .btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px}
.g-msg .btn.primary{color:#fff}
.g-msg .btn.soft{background:var(--surface2);color:var(--text)}
.g-msg .link{color:var(--pink);font-weight:700;font-size:13.5px}
.g-bottom{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.g-bottom span{font-size:13px;color:var(--muted)}
.g-bottom .export:disabled{opacity:.4}
#gAlbum:empty{display:none}
.gallery[data-mode="audio"] .g-tabs,.gallery[data-mode="audio"] #gAlbum,.gallery[data-mode="audio"] .g-bottom{display:none}
.gallery[data-mode="visual"] .g-search,.gallery[data-mode="visual"] #gTitle{display:none}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;overflow:hidden;pointer-events:none}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}}
@media (min-width:900px){
  .tools{justify-content:center}
  .tlwrap{height:176px}
}
</style>
</head>
<body>
<div id="app">

  <!-- Inicio -->
  <section class="home" id="home">
    <header class="brand">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4FA3"/><stop offset=".55" stop-color="#9B5CF6"/><stop offset="1" stop-color="#47E5FF"/></linearGradient></defs>
        <rect width="46" height="46" rx="14" fill="url(#lg)"/>
        <path d="M23 8c1.4 7.6 5.4 11.6 13 13-7.6 1.4-11.6 5.4-13 13-1.4-7.6-5.4-11.6-13-13 7.6-1.4 11.6-5.4 13-13z" fill="#fff"/>
        <circle cx="35" cy="11" r="2.4" fill="#fff" opacity=".85"/>
      </svg>
      <div>
        <h1>Editor de Video Nexora</h1>
        <p>Crea y edita tus videos desde el celular</p>
      </div>
    </header>

    <button class="new" id="btnNew">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span><strong>Nuevo proyecto</strong><span>Importa videos y fotos de tu galería</span></span>
    </button>
    <div class="formats" id="homeFormats" role="group" aria-label="Formato del proyecto"></div>

    <h2>Tus proyectos</h2>
    <div id="projects"></div>
  </section>

  <!-- Editor -->
  <section class="editor" id="editor" hidden>
    <div class="top">
      <button class="iconbtn" id="btnClose" aria-label="Cerrar proyecto"></button>
      <input class="name" id="projName" aria-label="Nombre del proyecto" maxlength="40">
      <select id="quality" aria-label="Calidad de exportación">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
      </select>
      <button class="export" id="btnExport">Exportar</button>
    </div>

  $('#shTitle').textContent = title;
  drawSheet();
  sheetEl.classList.add('open'); $('#scrim').hidden = false;
}
function drawSheet() {
  const s = curSheet; if (!s) return;
  const tabsEl = $('#shTabs');
  if (s.tabs) { tabsEl.hidden = false; tabsEl.innerHTML = s.tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k === s.tab}">${l}</button>`).join(''); }
  else { tabsEl.hidden = true; tabsEl.innerHTML = ''; }
  shBody.onclick = null; shBody.scrollTop = 0;
  s.render(shBody, s.tab);
}
$('#shTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b && curSheet) { curSheet.tab = b.dataset.tab; drawSheet(); } });
function closeSheet(silent) {
  if (!curSheet) return;
  curSheet = null; sheetEl.classList.remove('open'); $('#scrim').hidden = true;
  if (document.activeElement && sheetEl.contains(document.activeElement)) document.activeElement.blur();
  if (sheetChanged && !silent) commit();
  sheetChanged = false; renderTools();
}
$('#shDone').onclick = () => closeSheet();
$('#scrim').onclick = () => closeSheet();
const changed = () => { sheetChanged = true; dirty = true; };

function optGrid(items, cur) { return `<div class="grid">${items.map(([v, inner]) => `<button class="opt" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${inner}</button>`).join('')}</div>`; }
function onPick(body, fn) { body.onclick = e => { const b = e.target.closest('[data-v]'); if (b) { fn(b.dataset.v, b); body.querySelectorAll('.grid [data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); } }; }
function sliderHTML(id, label, min, max, step, val, out) { return `<div class="slider"><label for="${id}">${label}</label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o">${out}</output></div>`; }
function bindSlider(root, id, fmtFn, fn) { const el = root.querySelector('#' + id), o = root.querySelector('#' + id + 'o'); el.addEventListener('input', () => { const r = fn(+el.value); if (typeof r === 'number') el.value = r; o.textContent = fmtFn(+el.value); changed(); }); }

function speedSheet() {
  const c = focusClip(); if (!c) return;
  openSheet('Velocidad', body => {
    body.innerHTML = `<p class="hint">Cambia qué tan rápido se reproduce este clip.</p>` + optGrid([.5, .75, 1, 1.5, 2, 3].map(v => [v, `<span class="big">${v}×</span>`]), c.speed);
    onPick(body, v => { const st = clipStartOf(c); c.speed = +v; t = st + .001; changed(); renderTimeline(); syncMedia(); });
  });
}
function volSheet() {
  const it = getSel() || focusClip(); if (!it) return;
  openSheet('Volumen', body => {
    body.innerHTML = sliderHTML('vv', 'Volumen', 0, 2, .05, it.volume, Math.round(it.volume * 100) + '%') + `<div class="pills"><button class="pill" id="mute">${ic('vol')} Silenciar</button></div>`;
    bindSlider(body, 'vv', v => Math.round(v * 100) + '%', v => { it.volume = v; syncMedia(); });
    body.querySelector('#mute').onclick = () => { it.volume = 0; body.querySelector('#vv').value = 0; body.querySelector('#vvo').textContent = '0%'; changed(); syncMedia(); };
  });
}
function trimSheet() {
  const it = getSel() || focusClip(); if (!it) return;
  if (sel.kind === 'clip' && kindOf(it) === 'image') {
    return openSheet('Duración', body => {
      body.innerHTML = sliderHTML('dd', 'Duración', .5, 15, .1, it.dur, f1(it.dur));
      bindSlider(body, 'dd', f1, v => { it.dur = v; t = Math.min(t, total()); renderTimeline(); });
    });
  }
  const m = media.get(it.mediaId), D = m.duration;
  openSheet('Recortar', body => {
    body.innerHTML = `<p class="hint">Elige desde dónde empieza y dónde termina. Duración: <b id="tlen">${f1(it.out - it.in)}</b></p>` + sliderHTML('ti', 'Inicio', 0, D, .05, it.in, f1(it.in)) + sliderHTML('to', 'Fin', 0, D, .05, it.out, f1(it.out));
    const upd = () => { body.querySelector('#tlen').textContent = f1(it.out - it.in); renderTimeline(); syncMedia(); };
    bindSlider(body, 'ti', f1, v => { it.in = Math.min(v, it.out - .2); t = sel.kind === 'clip' ? clipStartOf(it) + .001 : it.start; upd(); return it.in; });
    bindSlider(body, 'to', f1, v => { it.out = Math.max(v, it.in + .2); t = sel.kind === 'clip' ? clipStartOf(it) + clipLen(it) - .05 : it.start + aLen(it) - .05; upd(); return it.out; });
  });
}
function filterSheet() {
  const c = focusClip(); if (!c) return;
  const m = media.get(c.mediaId);
  openSheet('Filtros', body => {
    body.innerHTML = optGrid(FILTERS.map(([id, label]) => [id, `<span class="sw" style="background-image:url('${m ? m.thumb : ''}');filter:${FMAP[id].css}"></span>${label}`]), c.filter)
      + `<div class="pills"><button class="pill" id="allF">${ic('copy')} Aplicar a todos los clips</button></div>`;
    onPick(body, v => { c.filter = v; changed(); renderTimeline(); });
    body.querySelector('#allF').onclick = e => { e.stopPropagation(); P.clips.forEach(x => x.filter = c.filter); changed(); renderTimeline(); toast('Filtro aplicado a todos los clips'); };
  });
}
function transSheet() {
  const c = focusClip(); if (!c) return;
  const i = P.clips.indexOf(c);
  openSheet('Transición', body => {
    body.innerHTML = (i === 0 ? `<p class="hint">La transición se aplica al entrar a este clip. Para verla, elige el segundo clip o uno posterior.</p>` : `<p class="hint">Efecto al pasar del clip anterior a este.</p>`)
      + optGrid(TRANS.map(([v, l]) => [v, `<span class="big">${ic(v === 'none' ? 'x' : 'trans')}</span>${l}`]), c.trans)
      + `<div class="pills"><button class="pill" id="allT">${ic('copy')} Aplicar a todos</button></div>`;
    onPick(body, v => { c.trans = v; changed(); renderTimeline(); t = Math.max(0, clipStartOf(c) - .4); if (i > 0) setPlaying(true); });
    body.querySelector('#allT').onclick = e => { e.stopPropagation(); P.clips.forEach((x, k) => { if (k > 0) x.trans = c.trans; }); changed(); renderTimeline(); toast('Transición aplicada a todos los clips'); };
  });
}
function fitSheet() {
  const c = focusClip(); if (!c) return;
  openSheet('Ajuste', body => {
    body.innerHTML = optGrid([['contain', `<span class="big">${ic('fit')}</span>Ajustar`], ['cover', `<span class="big">${ic('image')}</span>Llenar`]], c.fit)
      + `<p class="hint" style="margin-top:12px">Ajustar muestra el video completo. Llenar lo recorta para cubrir toda la pantalla.</p>`;
    onPick(body, v => { c.fit = v; changed(); });
  });
}
function ratioBox(a, b, max) { const s = max / Math.max(a, b); return `<i class="ratio" style="width:${Math.round(a * s)}px;height:${Math.round(b * s)}px"></i>`; }
function formatSheet() {
  openSheet('Formato', body => {
    body.innerHTML = optGrid(Object.entries(ASPECTS).map(([k, [a, b, l]]) => [k, `${ratioBox(a, b, 26)}<span>${k}</span><small style="font-weight:500;color:var(--muted)">${l}</small>`]), P.aspect);
    onPick(body, v => { P.aspect = v; fitCanvas(); changed(); });
  });
}
function bgSheet() {
  openSheet('Fondo', body => {
    const cur = P.bg.type === 'blur' ? 'blur' : P.bg.color;
    body.innerHTML = `<p class="hint">Se ve en los bordes cuando el video no llena la pantalla.</p>` + optGrid([['blur', `<span class="sw" style="background:linear-gradient(135deg,#FF4FA3,#9B5CF6,#47E5FF);filter:blur(3px)"></span>Desenfoque`], ...BGS.map(cl => [cl, `<span class="sw" style="background:${cl};box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)"></span>${cl === '#000000' ? 'Negro' : cl === '#FFFFFF' ? 'Blanco' : 'Color'}`])], cur);
    onPick(body, v => { P.bg = v === 'blur' ? { type: 'blur', color: '#000000' } : { type: 'color', color: v }; changed(); });

}
function openTextSheet(id, tab) {
  const tx = P.texts.find(x => x.id === id); if (!tx) return;
  if (!sel || sel.id !== id) select({ kind: 'text', id });
  openSheet('Texto', (body, tb) => {
    if (tb === 'texto') {
      body.innerHTML = `<textarea class="txt" id="txIn" rows="3" placeholder="Escribe tu texto" aria-label="Texto">${esc(tx.text)}</textarea><p class="hint" style="margin-top:8px">Arrastra el texto en la vista previa para moverlo.</p>`;
      const ta = body.querySelector('#txIn');
      ta.addEventListener('input', () => { tx.text = ta.value; changed(); renderTimeline(); });
      setTimeout(() => { ta.focus(); ta.select(); }, 60);
    } else if (tb === 'fuente') {
      body.innerHTML = optGrid(FONTS.map(f => [f.id, `<span class="big" style="font-family:'${f.family}';font-weight:${f.w}">Aa あ</span>${f.label}`]), tx.font);
      onPick(body, v => { tx.font = v; changed(); });
    } else if (tb === 'estilo') {
      body.innerHTML = optGrid(STYLES.map(([v, l]) => [v, `<span class="big" style="font-weight:800;${styleCSS(v)}">Ab</span>${l}`]), tx.style) + sliderHTML('ts', 'Tamaño', .03, .22, .005, tx.size, Math.round(tx.size * 100));
      onPick(body, v => { tx.style = v; changed(); });
      bindSlider(body, 'ts', v => Math.round(v * 100), v => { tx.size = v; });
    } else if (tb === 'color') {
      body.innerHTML = `<div class="colors">${COLORS.map(cl => `<button class="col" data-c="${cl}" style="background:${cl}" aria-label="Color ${cl}" aria-pressed="${cl === tx.color}"></button>`).join('')}<input type="color" id="cpick" value="${tx.color}" aria-label="Elegir otro color"></div>`;
      body.onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; tx.color = b.dataset.c; body.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); changed(); };
      body.querySelector('#cpick').addEventListener('input', e => { tx.color = e.target.value.toUpperCase(); body.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', 'false')); changed(); });
    } else if (tb === 'anim') {
      body.innerHTML = optGrid(ANIMS.map(([v, l]) => [v, `<span class="big">${ic(v === 'none' ? 'x' : 'zap')}</span>${l}`]), tx.anim);
      onPick(body, v => { tx.anim = v; changed(); t = tx.start; setPlaying(true); });
    } else {
      const maxS = Math.max(total(), tx.start + tx.dur, 1);
      body.innerHTML = sliderHTML('tst', 'Empieza', 0, maxS, .1, tx.start, f1(tx.start)) + sliderHTML('tdu', 'Dura', .5, 20, .1, tx.dur, f1(tx.dur));
      bindSlider(body, 'tst', f1, v => { tx.start = v; t = v; renderTimeline(); });
      bindSlider(body, 'tdu', f1, v => { tx.dur = v; renderTimeline(); });
    }
  }, [['texto', 'Teclado'], ['fuente', 'Fuente'], ['estilo', 'Estilo'], ['color', 'Color'], ['anim', 'Animación'], ['tiempo', 'Duración']], tab || 'texto');
}
function styleCSS(v) {
  switch (v) {
    case 'manga': return 'color:#FF4FA3;-webkit-text-stroke:1.5px #000;paint-order:stroke';
    case 'contorno': return 'color:#fff;-webkit-text-stroke:1.2px #000;paint-order:stroke';
    case 'neon': return 'color:#fff;text-shadow:0 0 6px #FF4FA3,0 0 12px #FF4FA3';
    case 'caja': return 'background:#FFD166;color:#000;padding:0 6px;border-radius:6px';
    case 'sombra': return 'text-shadow:3px 3px 0 #000;color:#47E5FF';
    default: return '';
  }
}

/* ---------- Importar ---------- */
const fileMedia = $('#fileMedia'), fileAudio = $('#fileAudio');
function pickMedia() { ensureAudio(); openGallery('visual', async list => { const e = await fetchGalleryItems(list); await importVisual(e); }); }
function pickAudio() { ensureAudio(); openGallery('audio', async list => { const e = await fetchGalleryItems(list); await importAudio(e[0]); }); }
let newPending = false;
async function importVisual(entries) {
  if (!entries.length || !P) return;
  let insertAt = P.clips.length;
  if (P.clips.length) { const cur = (sel && sel.kind === 'clip') ? getSel() : locate(t).c; insertAt = P.clips.indexOf(cur) + 1; }
  let added = 0, firstNew = null, i = 0;
  for (const en of entries) {
    i++; toast(entries.length > 1 ? `Importando ${i} de ${entries.length}…` : 'Importando…');
    const m = await addMedia(en.blob, en.kind, null, en.name);
    if (!m) { toast(`No se pudo abrir ${en.name}. Prueba con MP4, MOV, JPG o PNG.`); continue; }
    dbPut('media', { id: m.id, projectId: P.id, kind: en.kind, blob: en.blob, name: en.name }).then(r => { if (r === null && !warnedSpace) { warnedSpace = true; toast('No hay espacio para guardar este archivo en el dispositivo'); } });
    const c = { id: uid(), mediaId: m.id, in: 0, out: en.kind === 'image' ? 0 : m.duration, dur: 3, speed: 1, volume: 1, filter: 'original', fit: 'contain', trans: 'none' };
    P.clips.splice(insertAt++, 0, c); added++; if (!firstNew) firstNew = c;
  }
  if (added) { t = clipStartOf(firstNew) + .001; commit(); select(null); syncMedia(); fitCanvas(); toast(added > 1 ? `${added} clips agregados` : 'Clip agregado'); }
}
async function importAudio(en) {
  if (!en || !P) return;
  toast('Importando audio…');
  const m = await addMedia(en.blob, 'audio', null, en.name);
  if (!m) return toast(`No se pudo abrir ${en.name}. Prueba con MP3 o M4A.`);
  dbPut('media', { id: m.id, projectId: P.id, kind: 'audio', blob: en.blob, name: en.name });
  const start = t >= total() - .05 ? 0 : t;
  const a = { id: uid(), mediaId: m.id, start, in: 0, out: m.duration, volume: 1 };
  P.audios.push(a); commit(); select({ kind: 'audio', id: a.id }); toast('Audio agregado');
}
fileMedia.addEventListener('change', () => {
  const files = [...fileMedia.files]; if (!files.length) return;
  if (!P) { if (!newPending) return; newPending = false; createProject(); }
  importVisual(files.map(f => ({ blob: f, name: f.name, kind: f.type.startsWith('image') ? 'image' : 'video' })));
});
fileAudio.addEventListener('change', () => {
  const f = fileAudio.files[0]; if (!f || !P) return;
  importAudio({ blob: f, name: f.name, kind: 'audio' });
});

/* ---------- Galería integrada (app Android) ---------- */
const NA = window.NexoraAndroid;
const HAS_GALLERY = !!(NA && typeof NA.listMedia === 'function');
const gEl = $('#gallery'), gBody = $('#gBody'), gGrid = $('#gGrid');
const gal = { mode: 'visual', kind: 'video', items: {}, album: '', q: '', sel: [], list: [], shown: 0, onDone: null, perm: '' };
let gPreview = null, gPreviewId = null;
const fmtMs = ms => fmt(Math.round((ms || 0) / 1000));
const gKey = (k, id) => k + ':' + id;

function openGallery(mode, onDone) {
  if (!HAS_GALLERY) { systemPick(mode); return; }
  gal.mode = mode; gal.onDone = onDone; gal.sel = []; gal.items = {}; gal.album = ''; gal.q = ''; gal.perm = '';
  gal.kind = mode === 'audio' ? 'audio' : 'video';
  $('#gSearch').value = '';
  gEl.dataset.mode = mode; gEl.hidden = false;
  document.querySelectorAll('[data-gk]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.gk === gal.kind)));
  updGalleryBar();
  loadGallery();
}
function closeGallery() {
  gEl.hidden = true; gal.onDone = null; gGrid.innerHTML = '';
  if (gPreview) { gPreview.pause(); gPreview.removeAttribute('src'); gPreview.load(); }
  gPreviewId = null;
}
function systemPick(mode) {
  // Respaldo: selector de archivos del sistema
  if (mode === 'audio') { fileAudio.value = ''; fileAudio.click(); return; }
  if (!P) newPending = true;
  fileMedia.value = ''; fileMedia.click();
}
function gPerm() { try { return NA.mediaPermission(gal.kind) || 'granted'; } catch (e) { return 'granted'; } }
function loadGallery(force) {
  const st = gPerm();
  gal.perm = st;
  $('#gPartial').hidden = st !== 'partial';
  if (st === 'denied') { renderPermMsg(false); return; }
  if (force || !gal.items[gal.kind]) {
    try { gal.items[gal.kind] = JSON.parse(NA.listMedia(gal.kind) || '[]'); } catch (e) { gal.items[gal.kind] = []; }
  }
  renderAlbums(); renderGrid();
}
function renderPermMsg(askedBefore) {
  const what = gal.kind === 'audio' ? 'tu música y audios' : 'tus videos y fotos';
  gGrid.className = '';
  $('#gAlbum').innerHTML = '';
  gGrid.innerHTML = `<div class="g-msg"><b>Permite el acceso a ${what}</b>Así puedes elegirlos aquí mismo, sin salir del editor.<div class="btns"><button class="btn primary" id="gAsk">Permitir acceso</button>${askedBefore ? '<button class="btn soft" id="gSet">Abrir ajustes</button>' : ''}<button class="link" id="gSys">Usar el selector del sistema</button></div></div>`;
  $('#gAsk').onclick = () => NA.requestMedia(gal.kind);
  if ($('#gSet')) $('#gSet').onclick = () => NA.openSettings();
  $('#gSys').onclick = () => { const m = gal.mode; closeGallery(); systemPick(m); };
}
// Android avisa aquí después de pedir permisos o al volver a la app
window.nexoraPermResult = st => {
  if (gEl.hidden) return;
  const now = gPerm();
  if (now === 'denied') {
    if (st !== 'refresh' || gal.perm !== 'denied') { gal.perm = now; renderPermMsg(st !== 'refresh'); }
    return;
  }
  if (now !== gal.perm || st !== 'refresh') loadGallery(true);
};
function renderAlbums() {
  if (gal.mode === 'audio') return;
  const items = gal.items[gal.kind] || [], counts = new Map();
  for (const it of items) { const b = it.bucket || 'Otros'; counts.set(b, (counts.get(b) || 0) + 1); }
  const albums = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  if (gal.album && !counts.has(gal.album)) gal.album = '';
  $('#gAlbum').innerHTML = `<option value="">Recientes (${items.length})</option>` + albums.map(([b, n]) => `<option value="${esc(b)}"${b === gal.album ? ' selected' : ''}>${esc(b)} (${n})</option>`).join('');
}
function gFiltered() {
  let l = gal.items[gal.kind] || [];
  if (gal.album) l = l.filter(it => (it.bucket || 'Otros') === gal.album);
  if (gal.q) { const q = gal.q.toLowerCase(); l = l.filter(it => (it.name || '').toLowerCase().includes(q)); }
  return l;
}
function renderGrid() {
  gal.list = gFiltered(); gal.shown = 0;
  gGrid.className = gal.mode === 'audio' ? 'g-list' : 'g-grid';
  gGrid.innerHTML = '';
  gBody.scrollTop = 0;
  if (!gal.list.length) {
    gGrid.className = '';
    const msg = gal.q ? 'No hay audios con ese nombre.' : gal.kind === 'audio' ? 'No hay música ni audios en tu teléfono.' : gal.kind === 'image' ? 'No hay fotos aquí.' : 'No hay videos aquí.';
    gGrid.innerHTML = `<div class="g-msg">${msg}<div class="btns"><button class="link" id="gSys2">Buscar en otra app</button></div></div>`;
    $('#gSys2').onclick = () => { const m = gal.mode; closeGallery(); systemPick(m); };
    return;
  }
  appendMore();
}
function appendMore() {
  const next = gal.list.slice(gal.shown, gal.shown + 120); if (!next.length) return;
  const k = gal.kind;
  let h = '';
  if (gal.mode === 'audio') {
    for (const it of next) h += `<div class="g-row"><button class="g-prev" data-prev="${it.id}" aria-label="Escuchar">${ic(String(gPreviewId) === String(it.id) ? 'pause' : 'play')}</button><div class="g-meta"><b>${esc((it.name || 'Audio').replace(/\.[^.]+$/, ''))}</b><small>${fmtMs(it.dur)}</small></div><button class="g-use" data-use="${it.id}">Agregar</button></div>`;
  } else {
    for (const it of next) {
      const n = gal.sel.findIndex(x => x.key === gKey(k, it.id)) + 1;
      h += `<button class="g-tile${n ? ' on' : ''}" data-id="${it.id}" aria-label="${esc(it.name || '')}" aria-pressed="${n > 0}"><img loading="lazy" decoding="async" alt="" src="/media/thumb/${k}/${it.id}"><span class="g-dur">${k === 'video' ? fmtMs(it.dur) : ''}</span><span class="g-chk">${n || ''}</span></button>`;
    }
  }
  gGrid.insertAdjacentHTML('beforeend', h);
  gal.shown += next.length;
}
gBody.addEventListener('scroll', () => { if (gBody.scrollTop + gBody.clientHeight > gBody.scrollHeight - 700) appendMore(); }, { passive: true });
function refreshTileMarks() {
  const k = gal.kind;
  gGrid.querySelectorAll('.g-tile').forEach(el => {
    const n = gal.sel.findIndex(x => x.key === gKey(k, el.dataset.id)) + 1;
    el.classList.toggle('on', n > 0); el.setAttribute('aria-pressed', String(n > 0));

function updGalleryBar() {
  const n = gal.sel.length, b = $('#gAdd');
  b.disabled = !n; b.textContent = n ? `Agregar (${n})` : 'Agregar';
  $('#gCount').textContent = n ? (n === 1 ? '1 seleccionado' : `${n} seleccionados`) : 'Toca para elegir';

function markPreview() { gGrid.querySelectorAll('[data-prev]').forEach(b => { b.innerHTML = ic(b.dataset.prev === String(gPreviewId) ? 'pause' : 'play'); }); }
gGrid.addEventListener('click', e => {
  const tile = e.target.closest('.g-tile');
  if (tile) {
    const id = tile.dataset.id, key = gKey(gal.kind, id);
    const i = gal.sel.findIndex(x => x.key === key);
    if (i >= 0) gal.sel.splice(i, 1);
    else { const it = (gal.items[gal.kind] || []).find(x => String(x.id) === id); if (it) gal.sel.push({ key, k: gal.kind, id: it.id, name: it.name, mime: it.mime }); }
    refreshTileMarks(); updGalleryBar(); return;
  }
  const pv = e.target.closest('[data-prev]');
  if (pv) {
    const id = pv.dataset.prev;
    if (!gPreview) { gPreview = new Audio(); gPreview.addEventListener('ended', () => { gPreviewId = null; markPreview(); }); }
    if (String(gPreviewId) === id) { gPreview.pause(); gPreviewId = null; }
    else { gPreview.src = `/media/file/audio/${id}`; const p = gPreview.play(); if (p) p.catch(() => {}); gPreviewId = id; }
    markPreview(); return;
  }
  const use = e.target.closest('[data-use]');
  if (use) {
    const it = (gal.items.audio || []).find(x => String(x.id) === use.dataset.use); if (!it) return;
    const done = gal.onDone; closeGallery(); if (done) done([{ k: 'audio', id: it.id, name: it.name, mime: it.mime }]);
  }
});
document.querySelectorAll('[data-gk]').forEach(b => b.addEventListener('click', () => {

  gal.kind = b.dataset.gk; gal.album = '';
  document.querySelectorAll('[data-gk]').forEach(x => x.setAttribute('aria-selected', String(x === b)));

$('#gAlbum').addEventListener('change', e => { gal.album = e.target.value; renderGrid(); });
let gSearchTimer;
$('#gSearch').addEventListener('input', e => { clearTimeout(gSearchTimer); gSearchTimer = setTimeout(() => { gal.q = e.target.value.trim(); renderGrid(); }, 180); });
$('#gMoreAccess').onclick = () => NA.requestMedia(gal.kind);
$('#gClose').onclick = () => closeGallery();
$('#gAdd').onclick = () => { const s = gal.sel.slice(), done = gal.onDone; closeGallery(); if (done && s.length) done(s); };
async function fetchGalleryItems(list) {
  const out = []; let i = 0;
  for (const it of list) {
    i++; toast(list.length > 1 ? `Cargando ${i} de ${list.length}…` : 'Cargando…');
    try {
      const r = await fetch(`/media/file/${it.k}/${it.id}`); if (!r.ok) throw 0;
      const b = await r.blob(); if (!b.size) throw 0;
      const name = it.name || `archivo-${it.id}`;
      out.push({ blob: new File([b], name, { type: it.mime || b.type }), name, kind: it.k });
    } catch (e) { toast(`No se pudo abrir ${it.name || 'el archivo'}`); }
  }
  return out;
}

/* ---------- Exportar ---------- */
let rec = null, chunks = [], recMime = '', canceled = false, resultURL = null, downloadsNS = null;
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsNS = d; }).catch(() => {});
setTimeout(() => { if (!downloadsNS && window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsNS = d; }).catch(() => {}); }, 1500);
const ovCard = $('#ovCard'), RING = 2 * Math.PI * 62;
function showProgress() {
  ovCard.innerHTML = `<div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="62" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="10"/><circle id="rg" cx="70" cy="70" r="62" fill="none" stroke="url(#lg2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${RING}" stroke-dashoffset="${RING}"/><defs><linearGradient id="lg2"><stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#47E5FF"/></linearGradient></defs></svg><b id="rgp">0%</b></div><h3>Exportando tu video</h3><p>Mantén esta pantalla abierta hasta que termine. El video se graba en tiempo real.</p><div class="btns"><button class="btn ghost" id="exCancel">Cancelar</button></div>`;
  $('#overlay').hidden = false;
  $('#exCancel').onclick = () => { canceled = true; finishExport(); };
}
function updateExportProgress() { const p = clamp(t / Math.max(.01, total()), 0, 1); const rg = $('#rg'); if (rg) { rg.setAttribute('stroke-dashoffset', RING * (1 - p)); $('#rgp').textContent = Math.round(p * 100) + '%'; } }
async function startExport() {
  if (!P || !P.clips.length) return toast('Agrega un video o una foto para exportar');
  if (!cv.captureStream || !window.MediaRecorder) return toast('Este navegador no permite exportar video. Prueba con Chrome actualizado.');
  closeSheet(); setPlaying(false); ensureAudio(); unlockMedia();
  exportShort = +$('#quality').value; exporting = true; canceled = false; fitCanvas(); t = 0; draw();
  const stream = cv.captureStream(30);
  if (recDest) recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  recMime = types.find(x => { try { return MediaRecorder.isTypeSupported(x); } catch (e) { return false; } }) || '';
  try { rec = new MediaRecorder(stream, recMime ? { mimeType: recMime, videoBitsPerSecond: exportShort >= 1080 ? 10e6 : 6e6 } : {}); }
  catch (e) { exporting = false; fitCanvas(); return toast('No se pudo iniciar la exportación en este dispositivo'); }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  if (master) master.gain.value = 0;
  showProgress();
  syncMedia();
  await new Promise(r => setTimeout(r, 450));
  if (canceled) return;
  rec.start(250);
  playing = true; stall = 0; syncMedia();
}
function finishExport() {
  if (!exporting) return;
  playing = false; for (const m of media.values()) if (m.kind !== 'image') m.el.pause();
  try { if (rec && rec.state !== 'inactive') rec.stop(); else onRecStop(); } catch (e) { onRecStop(); }
}
function onRecStop() {
  exporting = false; if (master) master.gain.value = 1; fitCanvas(); setPlaying(false);
  if (canceled) { $('#overlay').hidden = true; toast('Exportación cancelada'); return; }
  const type = (rec && rec.mimeType) || recMime || 'video/webm';
  const blob = new Blob(chunks, { type });
  if (!blob.size) { $('#overlay').hidden = true; return toast('No se generó el video. Inténtalo de nuevo.'); }
  if (resultURL) URL.revokeObjectURL(resultURL);
  resultURL = URL.createObjectURL(blob);
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const fname = (P.name || 'nexora').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.' + ext;
  ovCard.innerHTML = `<h3>Tu video está listo</h3><p>${(blob.size / 1048576).toFixed(1)} MB en formato ${ext.toUpperCase()}</p><video src="${resultURL}" controls playsinline></video><div class="btns"><button class="btn primary" id="exSave">${ic('save')} Guardar en el dispositivo</button><button class="btn ghost" id="exClose">Volver al editor</button></div>`;
  $('#exClose').onclick = () => { $('#overlay').hidden = true; };
  $('#exSave').onclick = async e => {
    if (window.NexoraAndroid) return androidSave(blob, fname, e.currentTarget);
    if (downloadsNS) {
      try { await downloadsNS.save({ filename: fname, data: blob }); toast('Video guardado'); }
      catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'too_large' ? 'El video es muy grande. Exporta en 720p.' : 'No se pudo guardar el video'); }
    } else {
      const a = document.createElement('a'); a.href = resultURL; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    }
  };
}
async function androidSave(blob, fname, btn) {
  const A = window.NexoraAndroid, label = btn.innerHTML;
  btn.disabled = true;
  try {
    if (!A.begin(fname, (blob.type || 'video/mp4').split(';')[0])) throw 0;
    const CH = 786432;
    for (let o = 0; o < blob.size; o += CH) {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob.slice(o, o + CH)); });
      if (!A.append(b64)) throw 0;
      btn.textContent = 'Guardando… ' + Math.round(Math.min(1, (o + CH) / blob.size) * 100) + '%';
    }
    if (!A.finish()) throw 0;
    toast('Guardado en Películas › Nexora');
  } catch (e) { toast('No se pudo guardar el video. Revisa el espacio del teléfono.'); }
  btn.innerHTML = label; btn.disabled = false;
}
window.nexoraBack = () => {
  if (exporting) return true;
  if (!gEl.hidden) { closeGallery(); return true; }
  if (!$('#overlay').hidden) { $('#overlay').hidden = true; return true; }
  if (curSheet) { closeSheet(); return true; }
  if (P && sel) { select(null); return true; }
  if (P) { $('#btnClose').click(); return true; }
  return false;
};
$('#btnExport').onclick = startExport;
document.addEventListener('visibilitychange', () => { if (document.hidden && exporting) { canceled = true; finishExport(); toast('La exportación se detuvo porque saliste de la app'); } });

/* ---------- Proyectos e inicio ---------- */
function renderFormats() {
  $('#homeFormats').innerHTML = Object.entries(ASPECTS).map(([k, [a, b, l]]) => `<button class="fchip" data-f="${k}" aria-pressed="${k === homeAspect}">${ratioBox(a, b, 16)}${k} <span style="font-weight:500;color:var(--muted)">${l}</span></button>`).join('');
}
$('#homeFormats').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { homeAspect = b.dataset.f; renderFormats(); } });
const rel = ts => { const d = (Date.now() - ts) / 1000; if (d < 60) return 'Hace un momento'; if (d < 3600) return `Hace ${Math.floor(d / 60)} min`; if (d < 86400) return `Hace ${Math.floor(d / 3600)} h`; return new Date(ts).toLocaleDateString('es', { day: 'numeric', month: 'short' }); };
async function renderHome() {
  const list = ((await dbAll('projects')) || []).sort((a, b) => b.updated - a.updated);
  const el = $('#projects');
  if (!list.length) { el.className = ''; el.innerHTML = `<div class="empty">Aquí aparecerán tus ediciones.<br>Toca Nuevo proyecto para empezar con tus clips.</div>`; return; }
  el.className = 'projects';
  el.innerHTML = list.map(p => `<div class="proj"><button class="open" data-open="${p.id}"><div class="th" style="background-image:url('${p.thumb || ''}')"></div><div class="meta"><b>${esc(p.name)}</b><small>${fmt(p.duration)} · ${rel(p.updated)}</small></div></button><button class="del" data-del="${p.id}" aria-label="Borrar ${esc(p.name)}">${ic('trash')}</button></div>`).join('');
}
$('#projects').addEventListener('click', async e => {
  const d = e.target.closest('[data-del]');
  if (d) {
    if (!d.classList.contains('confirm')) { d.classList.add('confirm'); d.innerHTML = ic('trash') + 'Borrar'; setTimeout(() => { if (d.isConnected) { d.classList.remove('confirm'); d.innerHTML = ic('trash'); } }, 3000); return; }
    const id = d.dataset.del; const ms = (await dbMediaOf(id)) || [];
    for (const m of ms) await dbDel('media', m.id);
    await dbDel('projects', id); renderHome(); toast('Proyecto borrado'); return;
  }
  const o = e.target.closest('[data-open]');
  if (o) openProject(o.dataset.open);
});
function enterEditor() {
  $('#home').hidden = true; $('#editor').hidden = false;
  $('#projName').value = P.name;
  hist = [snap()]; hi = 0; sel = null; t = 0;
  updUndo(); requestAnimationFrame(() => { fitCanvas(); renderTimeline(); renderTools(); syncMedia(); dirty = true; });
}
function createProject() {
  clearMedia();
  const now = new Date();
  const name = 'Proyecto ' + now.toLocaleDateString('es', { day: 'numeric', month: 'short' }) + ' ' + now.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  P = { id: uid(), name, aspect: homeAspect, bg: { type: 'blur', color: '#000000' }, clips: [], texts: [], audios: [], created: Date.now() };
  enterEditor(); saveNow();
}
$('#btnNew').onclick = () => {
  ensureAudio();
  if (HAS_GALLERY) {
    openGallery('visual', async list => { createProject(); const e = await fetchGalleryItems(list); await importVisual(e); });
  } else { newPending = true; fileMedia.value = ''; fileMedia.click(); }
};
async function openProject(id) {
  ensureAudio();
  const list = (await dbAll('projects')) || []; const rec = list.find(p => p.id === id); if (!rec) return toast('No se encontró el proyecto');
  toast('Abriendo proyecto…');
  clearMedia();
  const ms = (await dbMediaOf(id)) || [];
  for (const m of ms) await addMedia(m.blob, m.kind, m.id, m.name);
  P = { ...rec };
  P.clips = P.clips.filter(c => media.has(c.mediaId)); P.audios = P.audios.filter(a => media.has(a.mediaId));
  enterEditor();
}
$('#btnClose').onclick = async () => {
  closeSheet(); setPlaying(false); await saveNow(); clearMedia(); P = null;
  $('#editor').hidden = true; $('#home').hidden = false; renderHome();
};
$('#projName').addEventListener('change', e => { if (!P) return; P.name = e.target.value.trim() || 'Sin título'; e.target.value = P.name; saveSoon(); });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* ---------- Controles ---------- */
$('#btnClose').innerHTML = ic('x'); $('#gClose').innerHTML = ic('x'); $('#btnPlay').innerHTML = ic('play'); $('#btnUndo').innerHTML = ic('undo'); $('#btnRedo').innerHTML = ic('redo');
$('#btnAddClip').innerHTML = ic('plus'); $('#zIn').innerHTML = ic('zin'); $('#zOut').innerHTML = ic('zout'); $('#shDone').innerHTML = ic('check');
$('#btnEmptyAdd').innerHTML = ic('plus') + 'Agregar videos o fotos';
$('#btnEmptyAdd').onclick = pickMedia; $('#btnAddClip').onclick = pickMedia;
$('#btnPlay').onclick = () => setPlaying(!playing);
$('#zIn').onclick = () => { pxs = clamp(pxs * 1.4, 12, 320); renderTimeline(); };
$('#zOut').onclick = () => { pxs = clamp(pxs / 1.4, 12, 320); renderTimeline(); };
document.addEventListener('keydown', e => {
  if (!P || exporting || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? $('#btnRedo') : $('#btnUndo')).click(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { if (sel) ACT.del(); }
});

FONTS.forEach(f => { try { document.fonts.load(`${f.w} 40px "${f.family}"`).then(() => { dirty = true; }); } catch (e) {} });
if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { dirty = true; });

renderFormats(); renderHome();
requestAnimationFrame(tick);
})();
</script>
